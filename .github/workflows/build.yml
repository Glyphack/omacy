name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build macOS binary
        env:
          CGO_ENABLED: "0"
          GOOS: darwin
          GOARCH: arm64
        run: go build -trimpath -ldflags="-s -w" -o dist/omacy-darwin-arm64 .

      - name: Write checksum
        working-directory: dist
        run: sha256sum omacy-darwin-arm64 > omacy-darwin-arm64.sha256

      - name: Publish dev build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "dev build" \
            --notes "Latest build of ${GITHUB_REF_NAME} at ${GITHUB_SHA}. Replaced on every push."
